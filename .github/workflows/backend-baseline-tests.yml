name: Backend baseline checks

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - test/database-rls
    paths:
      - "backend/**"
      - "docs/testing/**"
      - ".github/workflows/backend-baseline-tests.yml"

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run baseline configuration tests
        run: python -m unittest discover -s tests -v
