# Ways to close skill gaps, shown on the Resources page and saved into the action plan.
#
# skills: skill_ids from app/services/skill_gaps/data/core_catalog.json. A resource appears for every
#   role whose catalog contains one of its skills, and "closes" only those skills there.
# type: student_org | certification | online_course | school_course | project
# school: only shown to students whose account lists this university.
# alongside: true for ongoing commitments (clubs, meetups) that run next to the main plan.
#
# Seed list: check names, costs and links before a public launch. School courses and clubs should
# be confirmed against the current course guide and the student organization directory.

resources:
  # ── Student organizations ────────────────────────────────────────────────────────────────────
  - id: uw-madhacks
    type: student_org
    title: MadHacks
    provider: UW–Madison student hackathon
    meta: Each semester · free
    description: Build a working project with a team in one weekend and demo it to judges.
    skills: [programming, frontend, backend_apis, general_programming, python, llm, ai_agents, version_control]
    school: University of Wisconsin–Madison
    alongside: true
    url: https://www.madhacks.io/
  - id: uw-data-science-hub
    type: student_org
    title: Data Science Hub workshops
    provider: UW–Madison Data Science Hub
    meta: Weekly coding meetups · free
    description: Drop-in help and workshops on Python, R, statistics and data visualization.
    skills: [analytical_scripting, python, statistics, data_visualization, data_analysis, machine_learning]
    school: University of Wisconsin–Madison
    alongside: true
    url: https://datascience.wisc.edu/hub/

