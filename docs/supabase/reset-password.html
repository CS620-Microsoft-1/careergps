<!--
  Supabase "Reset password" email template (Authentication → Emails → Templates → Reset password).
  Paste the part below this comment as the message body; keep this file in sync with the dashboard.

  The link opens /auth/reset, which spends the single-use token (supabase.auth.verifyOtp with
  type "recovery") only when the student saves a new password, never when the page opens.
  University mail scanners (Microsoft 365 Safe Links) open every link to check it; a link that
  was used on open would be dead before the student clicked it. {{ .SiteURL }} is the Site URL in
  Authentication → URL Configuration.
-->
<h2>Reset your CareerGPS password</h2>
<p>Open the link below and choose a new password. The link works once and expires after an hour.</p>
<p><a href="{{ .SiteURL }}/auth/reset?token_hash={{ .TokenHash }}&type=recovery">Choose a new password</a></p>
<p>If you didn't ask to reset your password, you can ignore this email. Your password stays the same.</p>
